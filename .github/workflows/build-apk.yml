name: Compiler l'APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

- name: Set up Android SDK
  uses: android-actions/setup-android@v3
  with:
    packages: 'platform-tools'
  

      - name: Compilation
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk PoloDigitalCockpit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PoloDigitalCockpit-apk
          path: PoloDigitalCockpit.apk
