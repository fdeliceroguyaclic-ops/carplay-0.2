name: Compiler l'APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Le serveur GitHub fournit déjà un SDK Android : on l'utilise directement
      # (l'étape android-actions/setup-android n'est plus nécessaire).
      - name: Préparer le SDK Android préinstallé
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1)
          echo "sdkmanager utilisé : $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          ls "$ANDROID_HOME/platforms"

      - name: Compilation
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk PoloDigitalCockpit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PoloDigitalCockpit-apk
          path: PoloDigitalCockpit.apk

      # En cas d'échec : rapports Gradle téléchargeables (onglet Summary du run)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapports-erreur
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
